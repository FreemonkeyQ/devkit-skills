name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 结构校验（12 条规则）
        run: python3 scripts/lint.py
      - name: dv-help 总表未漂移
        run: python3 scripts/dv-help-gen.py --check
      - name: 常驻 token 估算
        run: python3 scripts/cost.py
